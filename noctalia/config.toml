[accessibility]
ui_scale = 1.00

[plugins]
enabled = ["k4n4t4/hypr-submap", "jamesfeeder/special-workspaces"]

[brightness]
enable_ddcutil = true

[control_center]
sidebar_section = "full"

[osd]
background_opacity = 1
offset_y = 250
position = "bottom_center"

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
external_ip_enabled = true

[shell.greeter_sync]
# idk what is this
auto_sync = false

[shell.panel]
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"

[shell.screenshot]
copy_to_clipboard = false
pipe_command = "satty -f -"
pipe_to_command = true
save_to_file = false

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 3.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 3.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 3.0
enabled = true
shortcut = "5"
variant = "destructive"

[shell.mpris]
blacklist = ["vivaldi"]

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = [
    "btop",
    "gtk3",
    "gtk4",
    "kcolorscheme",
    "kitty",
    "qt",
    "alacritty",
    "hyprland",
]
community_ids = ["yazi"]

[wallpaper]
directory = "~/syncthing-folders/Main/Me/Картиночеки"

[wallpaper.default]
path = "/home/sergey/syncthing-folders/Main/Me/Картиночеки/Fandoms/Games/Dark Souls 3/2560x1440-px-bridge-castle-cathedral-Dark-Souls-III-Moon-1292921-wallhere.com.jpg"


[bar.default]
start = [
    "launcher",
    "date",
    "clock_wd",
    "time",
    "spacer_1",
    "group:g1",
    "group:g2",
]
center = [
    # "workspaces",
    "special_workspaces",
    "taskbar",
    "audio_visualizer",
]
end = [
    "media",
    "spacer_1",
    "tray",
    "notifications",
    "bluetooth",
    "brightness",
    "volume",
    "network",
    "session",
]
concave_edge_corners = true
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.00
thickness = 35
widget_spacing = 16

[widget.date]
type = "clock"
format = "{:%F}"
capsule = true
capsule_fill = "on_secondary"
font_family = "consolas"
capsule_padding = 10

[widget.clock_wd]
type = "clock"
format = "w:{:%V} d:{:%u}"
capsule = true
capsule_fill = "on_secondary"
font_family = "consolas"
capsule_padding = 10

[widget.time]
type = "clock"
format = "{:%T}"
capsule = true
capsule_fill = "on_secondary"
font_family = "consolas"
capsule_padding = 10

[[bar.default.capsule_group]]
id = "g1"
border = ""
fill = "on_secondary"
members = ["temp", "sysmon_2", "sysmon_3"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
id = "g2"
border = ""
fill = "on_secondary"
members = ["keyboard_layout", "lock_keys", "hypr-submap"]
opacity = 1.0
padding = 6.0

[widget.spacer_1]
type = "spacer"

# 
# Start widgets
# 
[widget.launcher]
color = "secondary"

[widget.temp]
show_value = false

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.lock_keys]
display = "full"
hide_when_off = true
show_scroll_lock = true
interactive = true

[widget.hypr-submap]
type = "k4n4t4/hypr-submap:hypr-submap"
hide_when_default = true
color = "primary"

# 
# Center widgets
# 
[widget.workspaces]
pill_scale = 1.00
active_pill_size = 2.5
inactive_pill_size = 1.0
capsule = true
capsule_fill = "on_primary"
hide_when_empty = true
show_labels = true
label_source = "name"
max_label_chars = 20

[widget.audio_visualizer]
bands = 128
width = 128
mirrored = false

[widget.special_workspaces]
type = "jamesfeeder/special-workspaces:special-workspaces"
font_size = 0
active_style = "ghost"
inactive_style = "ghost"
capsule = true
capsule_fill = "on_secondary"

[widget.taskbar]
anchor = true
group_by_workspace = true
active_opacity = 1.0
inactive_opacity = 0.55
hide_empty_workspaces = true

# 
# End widgets
# 
[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.tray]
capsule = false
capsule_fill = "on_secondary"

[widget.session]
color = "error"
