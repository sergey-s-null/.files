[accessibility]
ui_scale = 1.00

[bar.default]
start = [
    "launcher",
    "clock",
    "spacer_1",
    "group:g1",
    "keyboard_layout",
    "lock_keys",
]
center = ["workspaces", "spacer_1", "active_window"]
end = [
    "media",
    "spacer_1",
    "tray",
    "notifications",
    "bluetooth",
    "brightness",
    "volume",
    "network",
    "session",
]
concave_edge_corners = true
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.00
thickness = 35
widget_spacing = 16

[[bar.default.capsule_group]]
id = "g1"
border = ""
fill = "on_secondary"
members = ["temp", "sysmon_2", "sysmon_3"]
opacity = 1.0
padding = 6.0

[brightness]
enable_ddcutil = true

[control_center]
sidebar_section = "full"

[osd]
background_opacity = 1
offset_y = 250
position = "bottom_center"

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
external_ip_enabled = true

[shell.greeter_sync]
# idk what is this
auto_sync = false

[shell.panel]
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"

[shell.screenshot]
copy_to_clipboard = false
pipe_command = "satty -f -"
pipe_to_command = true
save_to_file = false

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 3.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 3.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 3.0
enabled = true
shortcut = "5"
variant = "destructive"

[shell.mpris]
blacklist = ["vivaldi"]

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = [
    "btop",
    "gtk3",
    "gtk4",
    "kcolorscheme",
    "kitty",
    "qt",
    "alacritty",
    "hyprland",
]

[widget.clock]
format = "{:%T %F d:%u w:%V}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]

[widget.notifications]

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.temp]
show_value = false

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = false
capsule_fill = "on_secondary"

[widget.volume]

[widget.workspaces]
pill_scale = 1.00
active_pill_size = 2.5
inactive_pill_size = 1.0
capsule = true
capsule_fill = "on_primary"
hide_when_empty = true
show_labels = true
label_source = "name"
max_label_chars = 20
anchor = true

[widget.lock_keys]
display = "full"
hide_when_off = true
show_scroll_lock = true
interactive = false
