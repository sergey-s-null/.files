music_directory "~/syncthing-folders/Music Files/"

db_file      "~/.mpd/database"
log_file     "~/.mpd/log"
state_file   "~/.mpd/state"
sticker_file "~/.mpd/sticker.sql"

bind_to_address "127.0.0.1"
port            "6600"

auto_update     "yes"

audio_output {
    type "pipewire"
    name "PipeWire Sound Server"
}

replaygain "auto"
